name: Release P0 Review Archive

on:
  push:
    tags:
      - 'p0-review-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. p0-review-v2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package assets
        run: |
          mkdir -p dist
          # modified source files (with repo-relative paths)
          zip -q dist/modified-source.zip \
            app/lib/main.dart \
            app/lib/config/init.dart \
            app/lib/config/refena.dart \
            app/lib/provider/local_ip_provider.dart \
            app/lib/provider/network/scan_facade.dart \
            app/lib/provider/settings_provider.dart \
            app/pubspec.yaml \
            packages/localsend_isolates/lib/isolate.dart \
            packages/localsend_isolates/lib/src/task/discovery/discovery.dart \
            app/test/unit/provider/network_info_provider_test.dart \
            app/test/unit/provider/settings_provider_test.dart
          # full review archive (reports, both review rounds, verification logs, worklog)
          (cd review && zip -q -r ../dist/review-archive.zip .)
          # individual files (ASCII names for browser friendliness)
          cp review/deliverables/localsend-p0-fixes.patch dist/
          cp "review/review-report/LocalSend传输优化总报告-评审报告.md" dist/review-report-v2.md
          cp "review/original-report/LocalSend传输优化总报告.md" dist/original-report.md
          cp review/deliverables/flutter-upgrade-cost.md dist/
          cp review/deliverables/verification/flutter-analyze.log dist/
          cp review/deliverables/verification/flutter-test.log dist/
          sha256sum dist/* | sed 's|  dist/|  |' > dist/SHA256SUMS
          ls -la dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release exists, refreshing assets with --clobber"
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "LocalSend 传输优化独立评审 + P0 修复 ${TAG#p0-review-}" \
              --notes-file review/deliverables/release-notes.md \
              dist/*
          fi
