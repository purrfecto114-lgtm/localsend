name: Build macOS zip (unsigned)

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_macos_zip:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: packages/localsend_isolates
        run: rustup show

      # Upstream builds macOS releases locally with an Apple Developer team
      # (DEVELOPMENT_TEAM = 3W7H4PYMCV, "Apple Development" identity). CI has no
      # access to those certificates, so the project is patched to ad-hoc signing
      # ("-") before building. The resulting .app runs locally; Gatekeeper will
      # show an "unidentified developer" prompt on first launch (expected for
      # an unsigned community build).
      - name: Switch to ad-hoc code signing
        run: |
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' \
            -e 's/DEVELOPMENT_TEAM = 3W7H4PYMCV;/DEVELOPMENT_TEAM = "";/g' \
            app/macos/Runner.xcodeproj/project.pbxproj
          grep -c 'CODE_SIGN_IDENTITY = "-";' app/macos/Runner.xcodeproj/project.pbxproj

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for macOS
        working-directory: app
        run: flutter build macos --release

      - name: Zip .app bundle
        run: |
          cd app/build/macos/Build/Products/Release
          ditto -c -k --keepParent localsend_app.app "LocalSend-${{ needs.build.outputs.version }}-macos-universal.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: macos-zip-universal-result
          path: app/build/macos/Build/Products/Release/LocalSend-${{ needs.build.outputs.version }}-macos-universal.zip
          if-no-files-found: error
