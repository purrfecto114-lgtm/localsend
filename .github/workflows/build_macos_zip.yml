name: Build macOS zip (unsigned)

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_macos_zip:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: packages/localsend_isolates
        run: rustup show

      # Upstream builds macOS releases locally with an Apple Developer team
      # (DEVELOPMENT_TEAM = 3W7H4PYMCV, "Apple Development" identity). CI has no
      # access to those certificates, so the targets are rewritten to the
      # Flutter template's teamless shape: ad-hoc identity "-" (plain and
      # sdk-qualified variants) and no team. CODE_SIGN_STYLE stays Automatic
      # (the flutter template default); Manual with an empty provisioning
      # profile is exactly what makes Xcode demand a team.
      - name: Switch to ad-hoc code signing
        run: |
          sed -i '' \
            -e 's/"Apple Development"/"-"/g' \
            -e 's/DEVELOPMENT_TEAM = 3W7H4PYMCV;/DEVELOPMENT_TEAM = "";/g' \
            app/macos/Runner.xcodeproj/project.pbxproj
          # Guard: no development-team signing may survive the rewrite.
          ! grep -q 'Apple Development' app/macos/Runner.xcodeproj/project.pbxproj
          ! grep -qE 'DEVELOPMENT_TEAM = "?[0-9A-Z]' app/macos/Runner.xcodeproj/project.pbxproj
          grep -c 'CODE_SIGN_IDENTITY = "-";' app/macos/Runner.xcodeproj/project.pbxproj
          grep -c 'CODE_SIGN_STYLE = Automatic;' app/macos/Runner.xcodeproj/project.pbxproj

      # The app-group entitlement is what makes Xcode demand a development team
      # (it is provisioning-bound). CI has no team, so the key is dropped from
      # all three entitlements; the cost is that the share-extension handoff via
      # shared defaults degrades on macOS (in-app flows are unaffected) — this
      # is documented in the release notes.
      - name: Drop app-group entitlement (provisioning-bound, no team on CI)
        run: |
          for f in \
            app/macos/Runner/DebugProfile.entitlements \
            app/macos/Runner/Release.entitlements \
            app/macos/ShareExtension/ShareExtension.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.application-groups" "$f"
          done
          ! grep -rq 'application-groups' app/macos/Runner/ app/macos/ShareExtension/

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for macOS
        working-directory: app
        run: flutter build macos --release

      - name: Zip .app bundle
        run: |
          cd app/build/macos/Build/Products/Release
          # The product name comes from app/macos/Runner/Configs/AppInfo.xcconfig
          # (PRODUCT_NAME = LocalSend), not from the Dart package name.
          ditto -c -k --keepParent LocalSend.app "LocalSend-${{ needs.build.outputs.version }}-macos-universal.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: macos-zip-universal-result
          path: app/build/macos/Build/Products/Release/LocalSend-${{ needs.build.outputs.version }}-macos-universal.zip
          if-no-files-found: error
