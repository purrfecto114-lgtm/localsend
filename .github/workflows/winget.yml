name: Publish to WinGet
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to publish to WinGet
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # Steps skip on forks without the WINGET_TOKEN secret.
      - name: Publish LocalSend
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: LocalSend.LocalSend
          installers-regex: '^LocalSend-[0-9]+\.[0-9]+\.[0-9]+-windows-x86-64\.exe$'
          release-tag: ${{ inputs.release_tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish LocalSend CLI
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: LocalSend.LocalSend.CLI
          installers-regex: 'LocalSend-CLI-.*\.exe$'
          release-tag: ${{ inputs.release_tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
